<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WALKTEST — Terrace Residence · Multi Room Tour</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #brand{position:fixed;top:18px;left:22px;z-index:10;color:#fff;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  #brand h1{margin:0;font-size:20px;letter-spacing:3px;font-weight:600}
  #brand p{margin:4px 0 0;font-size:10px;letter-spacing:4px;opacity:.75}
  .wm{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:10;color:rgba(255,255,255,.45);font-size:9px;letter-spacing:2.5px;pointer-events:none}
  .hint{position:fixed;bottom:44px;left:0;right:0;text-align:center;z-index:10;color:rgba(255,255,255,.55);font-size:11px;pointer-events:none;transition:opacity 1s}
  .hs{position:fixed;z-index:6;transform:translate(-50%,-50%);cursor:pointer}
  .hs .dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.25);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:transform .2s}
  .hs:hover .dot{transform:scale(1.18)}
  .hs .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .2s}
  .hs:hover .lbl{opacity:1}
  .hs-floor .dot{width:44px;height:20px;border-radius:50%;border:2px solid rgba(120,220,255,.9);background:radial-gradient(circle,rgba(120,220,255,.35),rgba(0,60,90,.25));box-shadow:0 0 14px rgba(120,220,255,.5);animation:floorPulse 2s infinite}
  .hs-floor .lbl{color:#cdeeff}
  @keyframes floorPulse{0%,100%{box-shadow:0 0 10px rgba(120,220,255,.4)}50%{box-shadow:0 0 22px rgba(120,220,255,.75)}}

  #drawerBtn{position:fixed;bottom:22px;left:22px;z-index:12;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;letter-spacing:1.5px;padding:10px 14px;border-radius:9px;cursor:pointer;backdrop-filter:blur(4px)}
  #audioBtn{position:fixed;bottom:22px;right:22px;z-index:12;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:19px;border-radius:50%;cursor:pointer;backdrop-filter:blur(4px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #audioBtn:hover{border-color:#fff}
  #drawerBtn:hover{border-color:#fff}
  #drawer{position:fixed;left:0;right:0;bottom:0;z-index:11;display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px 16px 74px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.86));backdrop-filter:blur(6px)}
  #drawer.open{display:grid}
  .card{cursor:pointer;border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05);transition:border-color .2s,transform .2s}
  .card:hover{border-color:#fff;transform:translateY(-2px)}
  .card img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;opacity:.9}
  .card span{display:block;padding:7px 9px;color:#fff;font-size:11px;letter-spacing:1px}
    #minimap{position:fixed;right:16px;bottom:16px;z-index:12;width:190px;background:#fff;
    border:1px solid rgba(0,0,0,.25);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #minimap img{display:block;width:100%;border-radius:4px}
  #minimap .cap{font:600 9px/1.4 'Segoe UI',system-ui,sans-serif;color:#333;letter-spacing:1.5px;
    text-align:center;padding-top:4px}
  #minimap #yih{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
  #minimap #yih i{position:absolute;left:50%;top:50%;width:0;height:0;margin:-7px 0 0 -3px;
    border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:9px solid #1a73e8}
  #minimap #yih b{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
    border-radius:50%;background:#1a73e8;box-shadow:0 0 0 2px #fff}
  .toast{position:fixed;top:50%;left:0;right:0;text-align:center;color:#fff;font-size:13px;letter-spacing:2px;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s}
</style>
</head>
<body data-manifest="manifest.json">
<div id="app"></div>
<div id="brand"></div>
<div class="hint" id="hint">Drag to look — flick and it glides · scroll/pinch to zoom · move up/down for depth parallax · ← → to change room</div>
<div class="wm">CONFIDENTIAL — PROPRIETARY SAMPLE · © USHEREDWORLDS LIMITED</div>
<div id="hotspots"></div>
<div class="toast" id="toast"></div>
<div id="drawer"></div>
<div id="minimap" style="display:none"><img id="mapImg" alt=""><div id="yih"><i id="yhArrow"></i><b></b></div><div class="cap">YOU ARE HERE</div></div>
<div id="drawerBtn">▦ <span id="roomName">ROOMS</span></div>
<div id="audioBtn" title="Sound on/off" aria-label="Toggle sound">🔊</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module" src="../tour-engine/tour.walk.js?v=20260917w4"></script>
<script>
  // room name in the button + keyboard room cycling (kept outside the engine module)
  let names = {}, order = [];
  fetch('manifest.json').then(r=>r.json()).then(m=>{ order = m.rooms.map(r=>r.id); m.rooms.forEach(r=>names[r.id]=r.name); });
  // --- minimap: DISABLED per Philip 2026-09-15 (panel stuck on screen). Re-enable by restoring
  // the #minimap div + this block. Code kept for reference.
  let PLAN = null, mapReady = false;
  window.__mapUpdate = function(){ /* minimap removed */ };
  window.__onRoomChanged = function(room){ document.getElementById('roomName').textContent = (room.name||'ROOMS').toUpperCase(); };
  // --- ambient audio: starts on first interaction (browser autoplay policy), sound-ON default (Philip),
  // bottom-right corner button toggles mute. Survives room switches.
  (function(){
    const a=new Audio('ambient2.m4a'); a.loop=true; a.preload='auto'; a.volume=0.55;
    let muted=false, armed=false;
    const btn=document.getElementById('audioBtn');
    // PLAY ON LOAD: begin playback muted immediately (allowed by browsers), unmute on first touch.
    a.muted=true;
    a.play().catch(()=>{ /* if even muted play is blocked, fall back to first-touch start */ });
    function arm(){ if(armed) return; armed=true;
      a.muted=muted;  // unmute (or stay muted if user pre-muted)
      a.play().catch(()=>{});
    }
    ['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev, arm, {once:false, passive:true}));
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      armed=true;
      muted=!muted; a.muted=muted;
      btn.textContent = muted ? '🔇' : '🔊';
      a.play().catch(()=>{});
    });
    btn.textContent='🔊';
  })();
  addEventListener('keydown', e=>{
    if(!window.__viewer || !order.length) return;
    const i = order.indexOf(window.__viewer.room);
    if(e.key==='ArrowRight') window.__viewer.go(order[(i+1)%order.length]);
    if(e.key==='ArrowLeft')  window.__viewer.go(order[(i-1+order.length)%order.length]);
    if(e.key==='Escape')     document.getElementById('drawer').classList.remove('open');
  });
</script>
</body>
</html>
